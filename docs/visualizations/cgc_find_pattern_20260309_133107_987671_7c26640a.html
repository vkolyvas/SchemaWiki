            padding: 0;

        }

        body {

            background-color: var(--bg-dark);
            background-image:

            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        /* --- Header & Glassmorphism --- */
        .header {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--bg-card);

            padding: 12px 24px;

            border: 1px solid var(--border);

        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;

            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 15px var(--primary-glow);

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;

            -webkit-text-fill-color: transparent;

            font-weight: 400;
            padding-left: 12px;
            border-left: 1px solid var(--border);
            margin-left: 12px;
        }

        .stats-group {

        }

        .stat-item {

            align-items: flex-end;
        }

        .stat-label {
            font-size: 0.7rem;

            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .stat-count {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .search-container {
            position: fixed;
            top: 100px;
            left: 20px;
            z-index: 1000;
            width: 200px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 16px;

            display: flex;
            flex-direction: column;

        /* --- Main Network Container --- */
        #mynetwork {
            width: 100%;
            height: 100vh;
            cursor: grab;
        }

        #mynetwork:active {
            cursor: grabbing;
        }

        /* --- Side Info Panel --- */
        .info-panel {

            top: 100px;
            right: 20px;

            max-height: calc(100vh - 140px);

            overflow-y: auto;

        .info-panel.active {

        }

        .info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;

        .node-type-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .node-name {
            font-size: 1.4rem;
            font-weight: 700;
            word-break: break-all;
            margin-top: 8px;
        }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .info-value {
            font-size: 0.9rem;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 8px;
        }

        /* --- Legend --- */
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            z-index: 1000;
            width: 200px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .legend-title {
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--text-dim);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            font-size: 0.85rem;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
        }

        .legend-item:hover {
            color: #fff;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        /* --- Controls & Utilities --- */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: var(--text-dim);
            z-index: 800;
        }

        .close-btn {
            cursor: pointer;
            color: var(--text-dim);
            transition: color 0.2s;
        }

        .close-btn:hover { color: #fff; }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-group">
            <div class="logo-icon">C</div>
            <div class="logo-text">CodeGraphContext</div>

        <div class="stats-group">
            <div class="stat-item">
                <span class="stat-label">Nodes</span>

            <div class="close-btn" onclick="closePanel()">✕</div>

        <div class="info-section">
            <span class="info-label">File Path</span>

        <div class="info-section">
            <span class="info-label">Context</span>
            <div id="node-context" class="info-value">None</div>

        <div id="extra-info"></div>
    </div>

    <div class="search-container">
        <div class="legend-title" style="margin-bottom: 4px;">Quick Search</div>
        <input type="text" id="node-search" class="search-input" placeholder="Find symbol...">
    </div>

    <div id="mynetwork"></div>

    <div class="legend">
        <div class="legend-title">Entity Types</div>
        <div id="legend-items"></div>
    </div>

    <div class="controls">
        Scroll to zoom • Click to inspect • Drag to explore
    </div>

nchain3r/base/CodeGraphContext/SchemaWiki/tests/test_knowledge_extractor.py\nLine: 39","color":{"background":"#D1FAE5","border":"#10B981","highlight":{"background":"#34D399","border":"#10B981"},"hover":{"background":"#34D399","border":"#10B981"}}},{"id":"result_6","label":"APIRouter","group":"Module","title":"Module: APIRouter\nFile: None\nLine: None","color":{"background":"#F3E8FF","border":"#A855F7","highlight":{"background":"#C084FC","border":"#A855F7"},"hover":{"background":"#C084FC","border":"#A855F7"}}},{"id":"result_7","label":"features_router","group":"Module","title":"Module: features_router\nFile: None\nLine: None","color":{"background":"#F3E8FF","border":"#A855F7","highlight":{"background":"#C084FC","border":"#A855F7"},"hover":{"background":"#C084FC","border":"#A855F7"}}},{"id":"result_8","label":"hooks_router","group":"Module","title":"Module: hooks_router\nFile: None\nLine: None","color":{"background":"#F3E8FF","border":"#A855F7","highlight":{"background":"#C084FC","border":"#A855F7"},"hover":{"background":"#C084FC","border":"#A855F7"}}},{"id":"result_9","label":"router","group":"Module","title":"Module: router\nFile: None\nLine: None","color":{"background":"#F3E8FF","border":"#A855F7","highlight":{"background":"#C084FC","border":"#A855F7"},"hover":{"background":"#C084FC","border":"#A855F7"}}},{"id":"result_10","label":"search_router","group":"Module","title":"Module: search_router\nFile: None\nLine: None","color":{"background":"#F3E8FF","border":"#A855F7","highlight":{"background":"#C084FC","border":"#A855F7"},"hover":{"background":"#C084FC","border":"#A855F7"}}}];
        const edgesData = [{"from":"search_center","to":"result_0","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_1","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_2","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_3","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_4","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_5","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_6","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_7","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_8","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_9","label":"matches","arrows":"to","dashes":true},{"from":"search_center","to":"result_10","label":"matches","arrows":"to","dashes":true}];

        const nodes = new vis.DataSet(nodesData);
        const edges = new vis.DataSet(edgesData);

        const container = document.getElementById('mynetwork');
        const data = { nodes, edges };
        
        const options = {
            nodes: {
                shape: 'dot',
                size: 24,
                font: {
                    color: '#e2e8f0',
                    size: 14,
                    face: 'Outfit'
                },
                borderWidth: 2,
                shadow: {
                    enabled: true,
                    color: 'rgba(0,0,0,0.5)',
                    size: 10,
                    x: 0,
                    y: 4
                }
            },
            edges: {
                width: 1.5,
                color: {
                    color: 'rgba(148, 163, 184, 0.3)',
                    highlight: '#6366f1',
                    hover: '#818cf8'
                },
                font: {
                    size: 11,
                    face: 'Outfit',
                    color: '#94a3b8',
                    strokeWidth: 0
                },
                smooth: {
                    type: 'cubicBezier',
                    forceDirection: 'none',
                    roundness: 0.5
                },
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.5
                    }
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 300,
                hideEdgesOnDrag: true,
                navigationButtons: false,
                keyboard: true
            },
            physics: {
                enabled: true,
                stabilization: {
                    enabled: true,
                    iterations: 150
                },
                barnesHut: {
                    gravitationalConstant: -2000,
                    centralGravity: 0.3,
                    springLength: 120,
                    springConstant: 0.04,
                    damping: 0.09
                }
            },
            
            layout: {
                improvedLayout: true
            },
            physics: {
                enabled: true,
                forceAtlas2Based: {
                    gravitationalConstant: -50,
                    centralGravity: 0.01,
                    springLength: 150,
                    springConstant: 0.08,
                    damping: 0.4
                },
                maxVelocity: 50,
                solver: 'forceAtlas2Based',
                timestep: 0.35,
                stabilization: {
                    enabled: true,
                    iterations: 200,
                    updateInterval: 25
                }
            }
        
        };

        const network = new vis.Network(container, data, options);

        // Sidebar logic
        function closePanel() {
            document.getElementById('info-panel').classList.remove('active');
        }

        network.on('click', function(params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                const panel = document.getElementById('info-panel');
                
                document.getElementById('node-name').textContent = node.label;
                document.getElementById('node-badge').textContent = node.group;
                document.getElementById('node-badge').style.backgroundColor = node.color.border + '22';
                document.getElementById('node-badge').style.color = node.color.border;
                document.getElementById('node-badge').style.border = `1px solid ${node.color.border}`;
                
                // Parse tooltip for extra info
                const tooltipText = node.title || "";
                const lines = tooltipText.split('\n');
                let path = "Unknown";
                let context = "None";
                
                lines.forEach(l => {
                    if (l.startsWith('File:')) path = l.replace('File:', '').trim();
                    if (l.startsWith('Line:')) context = 'Line ' + l.replace('Line:', '').trim();
                });
                
                document.getElementById('node-path').textContent = path;
                document.getElementById('node-context').textContent = context;
                
                panel.classList.add('active');

                // Visual highlight
                const connectedNodes = network.getConnectedNodes(nodeId);
                nodes.forEach(n => {
                    nodes.update({id: n.id, opacity: 0.15});
                });
                nodes.update({id: nodeId, opacity: 1});
                connectedNodes.forEach(id => {
                    nodes.update({id: id, opacity: 1});
                });
            } else {
                closePanel();
                nodes.forEach(n => {
                    nodes.update({id: n.id, opacity: 1});
                });
            }
        });

        // Build legend from unique groups
        const groups = [...new Set(nodesData.map(n => n.group))];
        const legendContainer = document.getElementById('legend-items');
        groups.forEach(group => {
            const node = nodesData.find(n => n.group === group);
            const color = node?.color?.border || '#94a3b8';
            
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                <div class="legend-color" style="background: ${color}; color: ${color}"></div>
                <span>${group}</span>
            `;
            
            item.onclick = () => {
                // Highlight nodes of this group
                nodes.forEach(n => {
                    nodes.update({id: n.id, opacity: n.group === group ? 1 : 0.15});
                });
            };
            
            legendContainer.appendChild(item);
        });

        // Search logic
        const searchInput = document.getElementById('node-search');
        searchInput.oninput = (e) => {
            const term = e.target.value.toLowerCase();
            if (!term) {
                nodes.forEach(n => nodes.update({id: n.id, opacity: 1}));
                return;
            }
            
            nodes.forEach(n => {
                const matches = n.label.toLowerCase().includes(term);
                nodes.update({id: n.id, opacity: matches ? 1 : 0.1});
            });
        };
    </script>
