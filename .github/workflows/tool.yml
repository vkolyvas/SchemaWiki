name: SchemaWiki CLI Tool

on:
  push:
    branches: [master, main]
    paths:
      - 'wiki_tool.py'
      - 'schema_analyzer.py'
  workflow_dispatch:

jobs:
  test-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test wiki_tool.py
        run: |
          python3 wiki_tool.py --help
          python3 wiki_tool.py list

      - name: Test schema_analyzer.py
        run: |
          python3 schema_analyzer.py --analyze

      - name: Format check
        run: |
          pip install black --quiet
          black --check wiki_tool.py schema_analyzer.py || true
