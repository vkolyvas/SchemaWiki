name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'SchemaWiki/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Commit SchemaWiki Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if SchemaWiki has changes
          if git diff --quiet HEAD -- SchemaWiki/; then
            echo "No changes to SchemaWiki"
          else
            git add SchemaWiki/
            git commit -m "docs: Update SchemaWiki $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "Committed SchemaWiki changes"
          fi

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          force: true
