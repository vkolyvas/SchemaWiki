name: SchemaWiki Auto-Analyze

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to compare'
        required: false
        default: 'origin/main'
      github_pages:
        description: 'Deploy to GitHub Pages'
        type: boolean
        required: false
        default: true

jobs:
  analyze-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SchemaWiki Analyzer
        run: |
          python3 schema_analyzer.py --analyze

      - name: Update Wiki
        run: |
          python3 schema_analyzer.py --update --branch "${{ github.event.inputs.base_branch || 'origin/main' }}"

      - name: Copy to docs/ for GitHub Pages
        run: |
          # Create docs directory
          mkdir -p docs

          # Copy all wiki files to docs/
          cp -r .schemaWiki/* docs/

          # Create index.html redirect if it doesn't exist
          if [ ! -f docs/index.html ]; then
            cat > docs/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; URL=README.md">
    <title>SchemaWiki - Redirecting...</title>
</head>
<body>
    <p>Redirecting to <a href="README.md">Project Wiki</a>...</p>
</body>
</html>
EOF
          fi

      - name: Commit Wiki Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if there are any changes
          if git diff --quiet HEAD -- .schemaWiki/ docs/ 2>/dev/null; then
            echo "No wiki changes to commit"
          else
            git add .schemaWiki/ docs/
            git commit -m "docs: Update SchemaWiki $(date -u +'%Y-%m-%d')" || echo "Nothing to commit"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main || echo "Push failed"
          fi
