name: SchemaWiki Auto-Analyze

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to compare'
        required: false
        default: 'HEAD~1'

jobs:
  analyze-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SchemaWiki Analyzer
        run: python3 schema_analyzer.py --analyze

      - name: Update Wiki
        run: python3 schema_analyzer.py --update --branch "${{ github.event.inputs.base_branch || 'HEAD~1' }}"

      - name: Prepare docs folder
        run: |
          mkdir -p docs
          cp -r .schemaWiki/* docs/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; URL=README.md"></head><body><p><a href="README.md">Wiki</a></p></body></html>' > docs/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
