name: SchemaWiki Auto-Analyze

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to compare'
        required: false
        default: 'HEAD~1'

jobs:
  analyze-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SchemaWiki Analyzer
        run: python3 schema_analyzer.py --analyze

      - name: Update Wiki
        run: python3 schema_analyzer.py --update

      - name: Copy wiki to docs folder
        run: |
          mkdir -p docs
          cp -r .schemaWiki/* docs/
          # Don't overwrite existing index if it exists
          if [ ! -f docs/index.html ] || [ -z "$(cat docs/index.html)" ]; then
            echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; URL=README.md"></head><body><p><a href="README.md">Wiki</a></p></body></html>' > docs/index.html
          fi

      - name: Commit Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Check if there are changes to commit
          if ! git diff --quiet HEAD -- .schemaWiki/ docs/; then
            git add .schemaWiki/ docs/
            git commit -m "docs: Update SchemaWiki $(date -u +'%Y-%m-%d')"
          fi
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main --force || echo "Push failed or no changes"
