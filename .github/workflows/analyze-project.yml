name: SchemaWiki Auto-Analyze

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch to compare'
        required: false
        default: 'HEAD~1'

jobs:
  analyze-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SchemaWiki
        run: |
          # Download SchemaWiki analyzer
          wget -q https://raw.githubusercontent.com/vkolyvas/SchemaWiki/master/schema_analyzer.py
          chmod +x schema_analyzer.py

          # Run the analyzer
          python3 schema_analyzer.py --update

          # Copy wiki to docs folder for GitHub Pages
          mkdir -p docs
          cp -r .schemaWiki/* docs/

          # Configure git and commit changes
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .schemaWiki/ docs/ 2>/dev/null || true
          git commit -m "docs: Update SchemaWiki $(date -u +'%Y-%m-%d')" || exit 0

      - name: Push Changes
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:master --force || true
