name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: pip install black isort

      - name: Check black formatting
        run: black --check .

      - name: Check isort
        run: isort --check .

      - name: Check for missing imports
        run: |
          python -m py_compile api/server.py
          python -m py_compile core/feature_manager.py
          python -m py_compile mcp_server.py

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pydantic fastapi sqlalchemy

      - name: Verify basic imports
        run: |
          python -c "from pydantic import BaseModel; print('Pydantic OK')"
          python -c "from fastapi import FastAPI; print('FastAPI OK')"
          python -c "from sqlalchemy import Column; print('SQLAlchemy OK')"
