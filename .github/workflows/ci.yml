name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install lint tools
        run: pip install black isort

      - name: Check black formatting
        run: black --check .

      - name: Check isort
        run: isort --check .

      - name: Check for missing imports
        run: python -m py_compile api/*.py core/*.py storage/*.py schemas/*.py agent/*.py mcp_server.py agent_client.py

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install safety pip-audit

      - name: Run safety check
        run: safety check --disable-file

      - name: Run pip-audit
        run: pip-audit -r requirements.txt || true

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pytest pytest-asyncio httpx

      - name: Verify imports
        run: python -c "
          from api.server import app
          from core.feature_manager import FeatureManager
          from core.replay_engine import ReplayEngine
          from core.knowledge_extractor import KnowledgeExtractor
          from storage.metadata_db import Feature
          from storage.file_store import FileStore
          from schemas.feature_schema import FeatureCreate
          print('All imports successful')
          "

      - name: Run basic tests
        run: pytest -v --ignore=tests/ -x || true
